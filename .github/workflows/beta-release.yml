name: Beta Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm beta release deployment'
        required: true
        default: 'confirm'

env:
  NODE_VERSION: '20'

jobs:
  beta-release:
    name: Beta Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

      - name: Playwright E2E (beta-readiness)
        run: npx playwright test tests/e2e/beta-readiness.spec.ts

      - name: Playwright E2E (beta-ready)
        run: npx playwright test tests/e2e/beta-ready.spec.ts

      - name: Playwright E2E (action-center)
        run: npx playwright test tests/e2e/action-center.spec.ts tests/e2e/action-workflow.spec.ts

      - name: Playwright E2E (approval-flow + notifications)
        run: npx playwright test tests/e2e/approval-flow.spec.ts tests/e2e/notification.spec.ts

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Functional UI audit
        run: npm run audit:functional-ui

      - name: Check no critical TODOs
        run: |
          if grep -r "TODO" src/ --include="*.ts" --include="*.tsx" | grep -i "critical\|urgent\|hack\|FIXME" ; then
            echo "Critical TODOs/FIXMEs found"
            exit 1
          fi
          echo "No critical TODOs/FIXMEs found"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-report
          path: playwright-report/
          retention-days: 30

      - name: Beta release summary
        if: always()
        run: |
          echo "## Beta Release Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ job.steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck: ${{ job.steps.typecheck.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ job.steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ${{ job.steps.unit-tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright beta-readiness: ${{ job.steps.playwright-e2e-beta-readiness.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright beta-ready: ${{ job.steps.playwright-e2e-beta-ready.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright action-center: ${{ job.steps.playwright-e2e-action-center.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit: ${{ job.steps.security-audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Functional UI audit: ${{ job.steps.functional-ui-audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Critical TODOs check: ${{ job.steps.check-no-critical-todos.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment: ${{ job.status == 'success' && 'APPROVED' || 'BLOCKED' }}" >> $GITHUB_STEP_SUMMARY
